name: workflow
on:
  push:
    branches:
      - bran-secops-lab

jobs:
  SAST:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: 1RA PRUEBA
      #   run: |
      #     echo "TEST PRUEBA"

      - name: Validar Creación de Proyecto en SonarCloud
        id: validateProjectOnSonar
        run: |
          #pwd
          #ls -R
          set +e
          curl -f -X POST -u '${{ secrets.TOKEN_SONAR }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=${{ github.event.repository.name }}' -d 'project=${{ github.event.repository.name }}' -d 'organization=curso-secops' -d 'visibility=public'

          if [ $? -ne 0 ]; then
            echo "Proyecto ya creado en Sonar."
          else
            echo "Proyecto creado exitosamente en Sonar."

            echo "Se establece rama main por defecto."
            curl -X POST -u '${{ secrets.TOKEN_SONAR }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'
          fi
          set -e

      - name: Validando resultados con Sonar
        run: |
          issueValidate=$(curl -s -X GET -u '${{ secrets.TOKEN_SONAR }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}-curso-secops&facets=severities' | jq '.facets[0].values[1].count')
          echo "Cantidad de issues bloqueantes: $issueValidate"
          if [ "$issueValidate" -gt 0 ]; then
            echo "Se encontraron issues bloqueantes."
            #exit 1
          else
            echo "No se encontraron issues bloqueantes."
          fi
