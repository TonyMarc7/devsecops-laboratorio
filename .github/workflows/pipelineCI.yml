name: CI DevSecOps - Workflow
on:
  push:
    branches:
      - bran-secops-lab

jobs:
  SAST:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: 1RA PRUEBA
      #   run: |
      #     echo "TEST PRUEBA"
      - name: Validar Creación de Proyecto en SonarCloud
        id: validateProjectOnSonar
        run: |
          set +e
          curl -f -X POST -u '${{ secrets.TOKEN_SONAR }}:' 'https://sonarcloud.io/api/projects/create' \
            -d 'name=${{ github.event.repository.name }}' \
            -d 'project=${{ github.event.repository.name }}' \
            -d 'organization=curso-secops' \
            -d 'visibility=public'

          if [ $? -ne 0 ]; then
            echo "Proyecto ya existe en Sonar."
          else
            echo "Proyecto creado exitosamente en Sonar."

            echo "Se establece rama como main por defecto."
            curl -X POST -u '${{ secrets.TOKEN_SONAR }}:' 'https://sonarcloud.io/api/project_branches/rename' \
              -d 'name=main' \
              -d 'project=${{ github.event.repository.name }}'
          fi
          set -e

      - name: Validando Resultados Sonar
        run: |
          issueValidate=$(curl -s -X GET -u '${{ secrets.TOKEN_SONAR }}:' \
            'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}-curso-secops&facets=severities' \
            | jq '.facets[0].values[1].count')

            echo "Cantidad de issues bloqueantes: $issueValidate"

          if [ "$issueValidate" -gt 0 ]; then
            echo "Se encontraron issues vulnerables."
            # exit 1
          else
            echo "No se encontraron issues vulnerables."
          fi

  SCA:
    runs-on: ubuntu-latest
    needs: SAST
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Actions Java
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Validar Dependencia OWASP
        uses: dependency-check/Dependency-Check_Action@1.1.0
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: '${{ github.event.repository.name }}'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 11
            --enableRetired

      - name: Cargar los Resultados
        uses: actions/upload-artifact@master
        with:
          name: Chequeo de Reporte
          path: ${{github.workspace}}/reports

      # - name: Instalar Dependency Check
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y unzip wget
      #     wget https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.2/dependency-check-10.0.2-release.zip
      #     unzip dependency-check-10.0.2-release.zip -d dependency-check
      #     chmod +x dependency-check/dependency-check/bin/dependency-check.sh
      # - name: Ejecutar analisis SCA
      #   run: |
      #     mkdir -p reports
      #     dependency-check/dependency-check/bin/dependency-check.sh --scan . --format JSON --out reports/
      #     cat reports/dependency-check-report.json | jq '.dependencies | length'
      # - name: Validar vulnerabilidades SCA
      #   run: |
      #     TOTAL=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="Critical" or .severity=="High" or .severity=="Medium")] | length' reports/dependency-check-report.json)
      #     echo "Total vulnerabilidades críticas/altas/medias: $TOTAL"
      #     if [ "$TOTAL" -gt 0 ]; then
      #       echo "Se detectaron vulnerabilidades SCA."
      #       # exit 1
      #     fi

  ImgDocker:
    needs: SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Info
        uses: actions/download-artifact@master
        with:
          name: Info File
          path: ${{github.workspace}}/

      - name: Crear Imagen Docker
        run: |
          docker build --tag ${{ secrets.USER_DOCKER }}/bran-secops:latest
        
      - name: Aplicar Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.USER_DOCKER }}/bran-secops:latest
          format: 'table'
          # exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Sesion de Dockerhub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.USER_DOCKER }}
          password: ${{ secrets.PASS_DOCKER }}

      - name: Push a Dockerhub
        run: |
          docker push ${{ secrets.USER_DOCKER }}/bran-secops:latest

